name: Build/release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

jobs:
  release:
    continue-on-error: false
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.tool-versions'

      - name: Install dependencies
        run: npm ci

      - name: Build Chromium extension
        run: npm run package -- --simple

      - name: Rename artifact
        run: mv web-ext-artifacts/ghostery-chromium.zip ghostery-chromium-${{ github.ref_name }}.zip

      - name: Upload Release
        uses: ncipollo/release-action@v1.12.0
        with:
          artifacts: "ghostery-chromium-${{ github.ref_name }}.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          allowUpdates: true
